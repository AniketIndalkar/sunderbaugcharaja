#loader-overlay {
  position: fixed;
  z-index: 9999;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 1;
  pointer-events: all;
}

#loader-overlay.fade-out {
  opacity: 0;
  pointer-events: none;
}

.loader-logo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

#loader-overlay img {
  margin: 0 auto;
  display: block;
  max-width: 80vw;
  max-height: 60vh;
  width: auto;
  height: auto;
  opacity: 0;
  animation: loader-fadein 2.4s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;
  transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.loader-dots {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 30px;
  height: 30px;
}
.loader-dot {
  width: 12px;
  height: 12px;
  margin: 0 6px;
  background: goldenrod;
  border-radius: 50%;
  opacity: 0.7;
  animation: dot-bounce 1.2s infinite;
}
.loader-dot:nth-child(2) {
  animation-delay: 0.2s;
}
.loader-dot:nth-child(3) {
  animation-delay: 0.4s;
}
@keyframes dot-bounce {
  0%, 80%, 100% { transform: scale(1); opacity: 0.7; }
  40% { transform: scale(1.5); opacity: 1; }
}
@keyframes loader-fadein {
  from {
    opacity: 0;
    transform: scale(0.90);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');
        const lightboxPrev = document.getElementById('lightbox-prev');
        const lightboxNext = document.getElementById('lightbox-next');
        const lightboxDate = document.getElementById('lightbox-date');
        const images = document.querySelectorAll('.image-box img');
        // Exclude the last 2 images from the lightbox
        const imageArray = Array.from(images).slice(0, images.length - 2);
        let currentIndex = 0;

        function showLightbox(index) {
            currentIndex = index;
            lightboxImg.src = imageArray[currentIndex].src;
            // Find the date for the current image
            const parentBox = imageArray[currentIndex].closest('.image-box');
            let dateText = '';
            if (parentBox) {
                const dateDiv = parentBox.querySelector('.date');
                if (dateDiv) {
                    dateText = dateDiv.textContent.trim();
                }
            }
            lightboxDate.textContent = dateText;
            lightbox.style.display = 'flex';
        }

        // Only add click event to images included in the lightbox
        imageArray.forEach((image, idx) => {
            image.addEventListener('click', function () {
                showLightbox(idx);
            });
        });

        lightboxClose.addEventListener('click', function () {
            lightbox.style.display = 'none';
        });

        lightbox.addEventListener('click', function (e) {
            if (e.target === lightbox) {
                lightbox.style.display = 'none';
            }
        });

        lightboxPrev.addEventListener('click', function (e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + imageArray.length) % imageArray.length;
            showLightbox(currentIndex);
        });

        lightboxNext.addEventListener('click', function (e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % imageArray.length;
            showLightbox(currentIndex);
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (lightbox.style.display === 'flex') {
                if (e.key === 'ArrowLeft') {
                    lightboxPrev.click();
                } else if (e.key === 'ArrowRight') {
                    lightboxNext.click();
                } else if (e.key === 'Escape') {
                    lightboxClose.click();
                }
            }
        });

        // Swipe support for mobile (allow pinch-to-zoom)
        let touchStartX = 0;
        let touchEndX = 0;
        let isSwiping = false;
        lightboxImg.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                isSwiping = true;
                touchStartX = e.touches[0].clientX;
                touchEndX = touchStartX;
            } else {
                isSwiping = false; // More than one finger, likely pinch
            }
        });
        lightboxImg.addEventListener('touchmove', function(e) {
            if (isSwiping && e.touches.length === 1) {
                touchEndX = e.touches[0].clientX;
            }
        });
        lightboxImg.addEventListener('touchend', function(e) {
            if (isSwiping) {
                const swipeDistance = touchEndX - touchStartX;
                if (Math.abs(swipeDistance) > 50) { // Minimum swipe distance
                    if (swipeDistance < 0) {
                        lightboxNext.click(); // Swipe left
                    } else {
                        lightboxPrev.click(); // Swipe right
                    }
                }
            }
            isSwiping = false;
            touchStartX = 0;
